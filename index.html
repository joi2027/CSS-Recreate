<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Character</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="face" aria-label="A geometric yellow face with square eyes, a black mouth, white teeth, and a red tongue"></main>
        <div id="eyes"></div>
        <div class="eye eye-left"><div class="pupil"></div></div>
        <div class="eye eye-right"><div class="pupil"></div></div>
    </div>
    <div class="mouth">
        <div class="teeth" aria-hidden="true">
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
            <div class="tooth"></div>
        </div>
        <div class="tongue tongue-left"></div>
        <div class="tongue-slit"></div>
        <div class="tongue tongue-right"></div>
    </div>
   </main>

</body>
</html>
